<html lang="en">
<head>
    <meta charset="UTF-8">

    <script src="occasionalServices.js"></script>-->
    <script src="dayNames.js"></script>
    <script src="marginalia.js"></script>

    <script src="psalms.js"></script>

    <script>
// Make sure every face the text uses is actually loaded before measuring.
// document.fonts.ready alone can resolve early: fonts only start loading once
// text using them has been laid out, and content was just injected.
async function loadTypefaces() {
    const faces = [
        '400 1em Garamond',
        'italic 400 1em Garamond',
        '700 1em Garamond',
        'italic 700 1em Garamond',
        '1em EBGInit'
    ];
    try {
        await Promise.all(faces.map(f => document.fonts.load(f, 'AaBbCc')));
    } catch (e) {
        console.warn('font load issue', e);
    }
    await document.fonts.ready;
}

async function typesetText() {
    await loadTypefaces();
    KPTypeset.typesetAll();          // Knuth-Plass on every justified <p> in .content
    KPTypeset.watch('.content');     // re-break on width change
    // Optional real hyphenation:
    // KPTypeset.config.hyphenate = word => myHyphenator(word);  // -> ['syl','la','bles']
}
        
        window.onload = function() {
              let lit = "A1";
              let week = lit;
              getProper2(lit).then(async details => {
    document.getElementById('nameOfTheDay').textContent = `${getDayName(lit)}`;

    const collect = synthCollects(details.c, week);
    for (let e of document.getElementsByName('c')) e.innerHTML = collect;

    for (let e of document.getElementsByName('e_cit')) e.textContent = `${details.e.cit}`;
    for (let e of document.getElementsByName('e_txt')) e.textContent = details.e.txt;

    for (let e of document.getElementsByName('g_cit')) e.textContent = `${details.g.cit}`;
    for (let e of document.getElementsByName('g_txt')) e.textContent = details.g.txt;

document.getElementById("canticle").innerHTML = getPsalm(lit, 0);
            if (lit === "A3"){
                document.getElementById("additional-prayers").innerHTML = `<h1>Winter Embertide</h1>
                ${lxii}${xcii}${li}${ciii}
                <p class="dropcap">O Almighty God, who hast committed to the hands of men the ministry of reconciliation; We humbly beseech thee, by the inspiration of thy Holy Spirit, to put it into the hearts of many to offer themselves for this ministry; that thereby mankind may be drawn to thy blessed kingdom; through Jesus Christ our Lord. Amen.</p><p>Grant, we most humbly beseech Thee, O heavenly Father, that with holy Simeon and Anna, and all Thy devout servants, who waited for the consolation of Israel, we may at this time  so serve Thee with fasting and prayer, that by the celebration of the advent and birth of our blessed Redeemer, we may with them be filled with true joy and consolation, through the same Jesus Christ our Lord. Amen. <i>—John Cosin</i></p>`;
            }
                  
    await typesetText();

}).catch(async error => {
    for (let e of document.getElementsByName('e_txt')) {
        e.innerHTML = makeP(error.message);
    }

    await typesetText();
});
        }
    </script>
</head>
<body>
        <div class="content">
              <h1 id="nameOfTheDay"></h1>
              <img id="euchMarg" class="centerMarg">
              <div id="canticle"></div>
              <p name="c" class="dropcap"></p>
              <h2 name="e_cit"></h2>
              <p name="e_txt"></p>
              <h2 name="g_cit"></h2>
              <p name="g_txt"></p>
              <h2 hidden>The Preface</h2>
              <div id="preface"></div>
              <div id="additional-prayers"></div>

        </div>
</body>
